services:
  - type: web
    name: speech-to-text
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stt-db
          property: connectionString
      - key: PGSSL
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: NODE_VERSION
        value: "22"
databases:
  - name: stt-db
    plan: free
